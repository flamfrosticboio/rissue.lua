name: CI

on:
  pull_request:
    branches:
      - main
      - release
      - version/*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Note: when updating luarocks version, update it from job "prepare-tests" also
  LUAROCKS_VERSION: ${{ vars.LUAROCKS_VERSION || '3.13.0' }}
  LUAROCKS_TREE: ".luarocks"
  TEST_ALL: ${{ github.event_name == 'pull_request' && github.base_ref == 'release' }}
  VERBOSE: true
  TEST_STRICT: true
  API_TEST_FOLDER: "./.tmp/test-api"

jobs:
  format:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Format check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.5.2"
          args: --config-path ./.stylua.toml .

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(format): auto format with stylua'
          file_pattern: '**/*.lua'
          push_options: ''

  check-changes:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.f.outputs.src }}
      tests: ${{ steps.f.outputs.tests }}
    steps:
      - id: f
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - 'lua/**/*.lua'
            tests:
              - 'lua/**/*.lua'
              - 'test/**/*.lua'

  docs:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    needs: [format, check-changes]
    if: needs.check-changes.outputs.src == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install lua-language-server
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/LuaLS/lua-language-server/releases/latest | grep tag_name | cut -d '"' -f4)
          curl -L -o lls.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION#v}-linux-x64.tar.gz"
          mkdir -p /opt/lua-language-server
          tar -xzf lls.tar.gz -C /opt/lua-language-server
          ln -sf /opt/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server
          rm lls.tar.gz

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci
        working-directory: scripts

      - run: echo "$PWD/scripts/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run Autodoc
        run: node ./scripts/auto_doc.cjs

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: auto doc with auto_doc script'
          file_pattern: 'docs/**/*.md'
          push_options: ''

  lint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install selene
        run: |
          curl -fsSL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip -q selene.zip -d "$HOME/.selene"
          chmod +x "$HOME/.selene/selene"
          echo "$HOME/.selene" >> "$GITHUB_PATH"

      - name: Lint
        run: selene lua/ --config .selene.toml

      - name: Lint Tests
        if: ${{ !cancelled() }}
        run: selene test/ --config .selene.tests.toml

  prepare-tests:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.check-changes.outputs.tests == 'true' }}
    needs: [lint, format, docs, check-changes]
    uses: ./.github/workflows/cache-priming.yml
    with:
        prime-all: ${{ github.event_name == 'pull_request' && github.base_ref == 'release' }}

  tests:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    needs: [prepare-tests]
    strategy:
      fail-fast: true
      matrix:
        luaVersion: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'release' && '["5.1","luajit","5.2","5.3","5.4","5.5"]' || '["5.1", "luajit", "5.5"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Refresh apt index
        run: sudo apt-get update

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.luaVersion }}

      - uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: ${{ env.LUAROCKS_VERSION }}

      - name: Load Luarocks Dependencies Cache
        uses: actions/cache/restore@v6
        id: cache-test-dependencies
        with:
          path: ${{ env.LUAROCKS_TREE }}
          key: luarocks-${{ matrix.luaVersion }}-${{ runner.os }}-${{ hashFiles('.rockspec/*.rockspec') }}
          fail-on-cache-miss: true

      - name: Run Tests
        run: |
          luarocks test --tree=${{ env.LUAROCKS_TREE }} .rockspec/rissue-dev-1.rockspec -- --defer-print

      - name: Load cache for Api Specs
        id: cache-test-setup
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.API_TEST_FOLDER }}
          key: test-setup-${{ hashFiles('test/api/**/setup*.lua') }}
          fail-on-cache-miss: true

      # Install other npm tools that are used in api tests like http-proxy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./test/api/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./test/api/
        run: |
          npm ci

      - name: Run Api Tests
        shell: bash
        run: |
          luarocks test --tree=${{ env.LUAROCKS_TREE }} .rockspec/rissue-dev-1.rockspec -- --run=api

  test-status:
    runs-on: ubuntu-slim
    if: ${{ always() && needs.tests.result != 'skipped' }}
    needs: [tests]
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::A required test failed"
            exit 1
          fi
