name: Autodoc
on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Format check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "2.5.2"
          args: --config-path ./.stylua.toml .

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(format): auto format with stylua'
          file_pattern: '**/*.lua'
          push_options: ''

  docs:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev cmake libreadline-dev libncurses-dev

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install Luarocks Dependencies
        run: |
          luarocks install luafilesystem
          luarocks install dkjson

      - name: Install lua-language-server
        run: |
          set -e
          VERSION=$(curl -s https://api.github.com/repos/LuaLS/lua-language-server/releases/latest | grep tag_name | cut -d '"' -f4)
          curl -L -o lls.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${VERSION}/lua-language-server-${VERSION#v}-linux-x64.tar.gz"
          mkdir -p /opt/lua-language-server
          tar -xzf lls.tar.gz -C /opt/lua-language-server
          ln -sf /opt/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server
          rm lls.tar.gz

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install Node Dependencies
        working-directory: ./
        run: |
          npm ci

      - name: Run Autodoc
        run: ./scripts/doc

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: auto doc with auto_doc script'
          file_pattern: 'docs/**/*.md'
          push_options: ''
